# Reusable: runs `terragrunt plan` or `terragrunt apply` across the caller's
# repo and posts a truncate-and-minimize PR comment. A run triggered by a PR
# comment (`terragrunt plan` or `terragrunt apply`) reacts to that comment.
# Apply also flips the `terragrunt/apply` merge-gate status and auto-merges on
# success.
#
# Collapses what were two nearly-identical files (noisypigeon ADR-0155 §2):
# every substantive change either one ever needed, it turned out, both
# needed, across six commits spanning ADR-0124/0128/0129/0134/0138. The
# subcommand and the apply-only merge-gate/auto-merge step are the genuine
# differences, gated on `inputs.command` below.
#
# Since v4.0.0 an apply applies only the plan that was reviewed (LIB-0022).
# Plan saves every unit's plan, encrypts the set with the caller's sops/age
# recipient (plan-archive.sh) and uploads it as the artifact
# terragrunt-plan-<pr>-<head sha>. Apply downloads exactly that artifact and
# applies it with -lock-timeout=0s. It refuses to run if there is no plan for
# the PR's current head, or if the units it would select have changed since the
# plan. Terraform itself refuses a plan whose state moved on ("Saved plan is
# stale"), and the state lock (root.hcl v4.2.0) refuses a concurrent apply. Every
# one of those failures needs the same fix, a new plan, which a `terragrunt
# plan` comment makes without a push. So callers grant `actions: write`, for
# plan to replace and upload the artifact and for apply to read it, and their
# prepare_cmd must run fetch_script, which puts plan-archive.sh in scripts_dir.
#
# Both commands plan and apply the PR's head, never the merge ref, so what was
# planned is the tree that gets applied.
#
# Since v4.8.0 that automatic re-plan, if it finds nothing left to apply,
# turns the gate green and merges, with no last apply.
#
# Since v4.7.0 a staged apply's next stage plans by itself, through a replan
# job in the caller that this workflow's `deferred` output triggers, and the
# final apply merges with the caller's BOT_GITHUB_TOKEN (LIB-0027).
#
# Since v4.5.0 a run reports as a summary comment with a row per leaf, then
# detail comments with a section per leaf, never truncated (LIB-0026).
# render-run-comments.js in scripts_dir builds the bodies, from output.txt,
# each unit's JSON plan and the masked values; this file only posts them.
#
# Since v4.3.0 a workload's leaves are planned one at a time, and a leaf whose
# workload dependencies are new or changing is deferred to the next stage: an
# apply that leaves any deferred keeps terragrunt/apply pending and doesn't
# merge, and a `terragrunt plan` comment plans the next stage (LIB-0024).
#
# Since v4.2.0 a spoke's workload leaves (LIB-0023) are generated here, from
# each workloads/<workload>/values.yaml, rather than committed. "Select units"
# runs resolve-workloads.sh, plans every leaf of a workload whose values.yaml
# changed, and plans an instance values.yaml no longer has as a destroy, from
# its stub at the PR's base. Since v5.2.0 a zone's leaves (LIB-0036) are
# generated and selected the same way, from zones/<zone>/zone.yaml.
#
# secrets_files and prepare_cmd exist for spokes (LIB-0003). A spoke keeps its
# secrets in one sops file per concern under terraform/secrets/ (LIB-0012), and
# its root.hcl is materialized from the library's template, so it has to run its
# fetcher and the resolver before terragrunt can find a root at all. Since
# v3.0.0 secrets_files defaults to every terraform/secrets/*.enc the caller has,
# so a spoke passes neither the old single file nor a list to keep in step.
name: Terragrunt run

on:
  workflow_call:
    inputs:
      # workflow_call doesn't start a new triggering event -- this run is
      # still the caller's own pull_request/issue_comment event throughout,
      # so context.issue / context.payload below are the caller's real event
      # data without anything needing to be passed as an input.
      command:
        description: "terragrunt subcommand to run: plan or apply."
        type: string
        required: true
      checkout_ref:
        description: "git ref to check out before running. Empty (the default) means the PR's head commit: the event's own SHA on pull_request, or the SHA the API reports for the PR on issue_comment."
        type: string
        required: false
        default: ""
      secrets_files:
        description: "Space-separated sops dotenv files (relative to the caller's repo root) whose decrypted values are masked in the log. Empty (the default) means every terraform/secrets/*.enc that exists."
        type: string
        required: false
        default: ""
      prepare_cmd:
        description: "Optional command run from the caller's repo root before terragrunt -- e.g. fetching library and materializing root.hcl."
        type: string
        required: false
        default: ""
      scripts_dir:
        description: "Path (relative to the caller's repo root) to the library's .github/scripts, as left by prepare_cmd's fetcher."
        type: string
        required: false
        default: ".lib-src/.github/scripts"
    secrets:
      SOPS_AGE_KEY:
        required: true
      # Merges the PR after its final apply (LIB-0027 §2). A merge made with
      # GITHUB_TOKEN would start none of the workflows that follow a merge,
      # and the callers' contents: read can't merge at all.
      BOT_GITHUB_TOKEN:
        required: false
    # What the run did, for a caller's replan job (LIB-0027 §1).
    outputs:
      deferred:
        description: "'true' when the run left workload leaves deferred (LIB-0024)."
        value: ${{ jobs.run.outputs.deferred }}
      exit_code:
        description: "The run's exit code."
        value: ${{ jobs.run.outputs.exit_code }}

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      deferred: ${{ steps.run.outputs.deferred }}
      exit_code: ${{ steps.run.outputs.exit_code }}
    env:
      PLAN_DIR: ${{ github.workspace }}/.terragrunt-plans
      JSON_DIR: ${{ github.workspace }}/.terragrunt-plans-json
      ARTIFACT_PREFIX: terragrunt-plan-${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: React to triggering comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      # A comment event carries no head commit, so ask the API for it. Not
      # refs/pull/<n>/head: GitHub sometimes never creates that ref, and the
      # checkout then fails before anything runs (runway#56).
      - name: Resolve the PR's head commit
        id: pr_head
        if: inputs.checkout_ref == '' && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.head.sha);

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || steps.pr_head.outputs.sha }}
          fetch-depth: 0

      - name: Ensure a local main ref exists
        run: git fetch origin main:refs/heads/main

      - name: Resolve head
        id: head
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT_PREFIX-$sha" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@v2

      - name: Debug resolved terraform binary
        run: terraform version

      - name: Mask decrypted secret values
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SECRETS_FILES: ${{ inputs.secrets_files }}
        run: |
          shopt -s nullglob
          [ -n "$SECRETS_FILES" ] || SECRETS_FILES=$(echo terraform/secrets/*.enc)
          if [ -z "$SECRETS_FILES" ]; then
            echo "::warning::No secrets files to mask: terraform/secrets/ has no .enc files"
          fi
          # Each masked value is also kept, readable by this job only, so the
          # comment step can mask its comments too (LIB-0026 §7). "Forget
          # masked values" deletes the file whatever happens.
          masked="$RUNNER_TEMP/masked.txt"
          : > "$masked"
          chmod 600 "$masked"
          for file in $SECRETS_FILES; do
            while IFS='=' read -r key value; do
              [[ -z "$key" || "$key" == \#* || "$key" == sops_* ]] && continue
              echo "::add-mask::$value"
              printf '%s\n' "$value" >> "$masked"
            done < <(sops --decrypt --input-type dotenv --output-type dotenv "$file")
          done
          # A workload's secrets.yaml (LIB-0025), every value, one line at a
          # time so a multi-line secret is masked whole.
          for file in workloads/*/secrets.yaml; do
            while IFS= read -r value; do
              [ -n "$value" ] && echo "::add-mask::$value" && printf '%s\n' "$value" >> "$masked"
            done < <(sops --decrypt --output-type json "$file" | jq -r '.. | scalars | tostring')
          done

      - name: Prepare
        if: inputs.prepare_cmd != ''
        env:
          PREPARE_CMD: ${{ inputs.prepare_cmd }}
        run: bash -euo pipefail -c "$PREPARE_CMD"

      - name: Clear terragrunt cache
        run: find . -type d -name ".terragrunt-cache" -exec rm -rf {} +

      # terragrunt's own --filter-affected only tracks changes to a unit's
      # terragrunt.hcl / HCL-level reads, not files a .tf module reads via
      # Terraform's native file()/fileset() (e.g. a dashboard JSON asset) -- a
      # documented upstream gap (gruntwork-io/terragrunt#6952, not planned to be
      # fixed pre-1.2; see noisypigeon docs/adr/0138). Union it with an explicit
      # --filter per leaf directory containing any changed file, computed by
      # walking up to the nearest terragrunt.hcl -- multiple --filter flags
      # combine with OR logic.
      #
      # But only for a directory the git filter didn't already select. The git
      # filter runs its units in a worktree, an explicit --filter runs the same
      # unit in the checkout, and terragrunt does not deduplicate the two: a
      # unit matched by both runs twice, concurrently, against one state key.
      # For a new leaf that created every resource twice and orphaned one copy
      # (noisypigeon/noisypigeon.com#19). If the lookup fails, fail the run
      # rather than risk the duplicate.
      #
      # Unit leaves, a workload's (LIB-0023) or a zone's (LIB-0036), are
      # generated, never committed, so the git filter can't see them: it plans
      # in worktrees of tracked files. A spoke with a workloads/ or zones/
      # excludes them from the git filter -- deleting a committed stub must not
      # plan its destroy -- and selects them here instead, by unit: every leaf
      # of a workload whose values.yaml changed, of a zone whose zone.yaml
      # changed and of the workload it names before or after, and of every
      # unit when root.hcl, spoke.hcl, zones.yaml or a secret changed. An instance values.yaml no longer has is planned as a destroy
      # from its stub as of the PR's base (`git merge-base main HEAD`, which
      # moves only when the head does), generated in a worktree of that base.
      #
      # Written to a file, one argument per line, so plan and apply select
      # units the same way, and units.txt is what apply compares with the
      # saved plan's manifest. A workload spoke's units.txt also names the base
      # and each destroy, so apply can't run against different ones.
      - name: Select units
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TG_TF_PATH: terraform
          SCRIPTS_DIR: ${{ inputs.scripts_dir }}
        run: |
          set -euo pipefail
          base=$(git merge-base main HEAD)
          workloads=false
          if [ -d workloads ] || [ -d zones ] || git cat-file -e "$base:workloads" 2>/dev/null || git cat-file -e "$base:zones" 2>/dev/null; then
            workloads=true
          fi
          if [ "$workloads" = true ]; then
            FILTER_ARGS=(--filter '[main...HEAD] | !./workloads/** | !./zones/**')
          else
            FILTER_ARGS=(--filter '[main...HEAD]')
          fi
          git_units=$(terragrunt --no-color find "${FILTER_ARGS[@]}" --filter-allow-destroy --json | jq -r '.[].path')
          dirs=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in workloads/* | zones/*) continue ;; esac
            dir=$(dirname "$f")
            while [ "$dir" != "." ] && [ ! -f "$dir/terragrunt.hcl" ]; do
              dir=$(dirname "$dir")
            done
            [ -f "$dir/terragrunt.hcl" ] || continue
            grep -qxF "$dir" <<<"$git_units" && continue
            case " $dirs " in
              *" $dir "*) continue ;;
            esac
            dirs="$dirs $dir"
            FILTER_ARGS+=(--filter "./$dir")
          done < <(git diff --name-only main...HEAD)

          WORKLOAD_ARGS=()
          : > "$RUNNER_TEMP/destroy-units.txt"
          if [ "$workloads" = true ]; then
            resolver="$GITHUB_WORKSPACE/$SCRIPTS_DIR/resolve-workloads.sh"
            "$resolver"
            changed=$(git diff --name-only "$base" HEAD)
            # Each a unit directory, workloads/<w> or zones/<z>.
            if grep -qE '^(root\.hcl|spoke\.hcl|zones\.yaml|terraform/secrets/)' <<<"$changed"; then
              names=$(for f in workloads/*/values.yaml zones/*/zone.yaml; do if [ -f "$f" ]; then dirname "$f"; fi; done)
            else
              names=$(grep -E '^workloads/[^/]+/(values|secrets)\.yaml$' <<<"$changed" | cut -d/ -f1-2 || true)
              # A zone, and the workload it names at the base and at the head.
              while IFS= read -r zf; do
                [ -z "$zf" ] && continue
                names="$names"$'\n'"$(dirname "$zf")"
                for owner in "$( { git show "$base:$zf" 2>/dev/null || true; } | yq '.workload // ""')" "$( { cat "$zf" 2>/dev/null || true; } | yq '.workload // ""')"; do
                  [ -n "$owner" ] && [ -f "workloads/$owner/values.yaml" ] && names="$names"$'\n'"workloads/$owner"
                done
              done < <(grep -E '^zones/[^/]+/zone\.yaml$' <<<"$changed" || true)
              names=$(sort -u <<<"$names")
            fi
            # Their own filters, run by their own terragrunt invocation, never
            # beside the git expression: with one in play, terragrunt resolves
            # a path against the git filter's base worktree, so a stub that was
            # committed there plans as a removal and a generated one, being
            # gitignored, isn't found at all.
            "$resolver" --list | LC_ALL=C sort > "$RUNNER_TEMP/head-stubs.txt"
            for u in $names; do
              while IFS= read -r unit; do
                WORKLOAD_ARGS+=(--filter "./$unit")
              done < <(grep "^$u/" "$RUNNER_TEMP/head-stubs.txt" || true)
            done

            git worktree add -q --detach "$RUNNER_TEMP/base" "$base"
            if [ -d "$RUNNER_TEMP/base/workloads" ] || [ -d "$RUNNER_TEMP/base/zones" ]; then
              (cd "$RUNNER_TEMP/base" && "$resolver" >/dev/null && "$resolver" --list) | LC_ALL=C sort > "$RUNNER_TEMP/base-stubs.txt"
            else
              : > "$RUNNER_TEMP/base-stubs.txt"
            fi
            comm -23 "$RUNNER_TEMP/base-stubs.txt" "$RUNNER_TEMP/head-stubs.txt" > "$RUNNER_TEMP/destroy-units.txt"
          fi

          printf '%s\n' "${FILTER_ARGS[@]}" > "$RUNNER_TEMP/filter-args"
          printf '%s\n' ${WORKLOAD_ARGS[@]+"${WORKLOAD_ARGS[@]}"} > "$RUNNER_TEMP/workload-args"
          {
            terragrunt --no-color find "${FILTER_ARGS[@]}" --filter-allow-destroy --json | jq -r '.[].path'
            if [ ${#WORKLOAD_ARGS[@]} -gt 0 ]; then
              terragrunt --no-color find "${WORKLOAD_ARGS[@]}" --json | jq -r '.[].path'
            fi
          } | sed 's|^\./||' | LC_ALL=C sort -u > "$RUNNER_TEMP/units.txt"
          if [ "$workloads" = true ]; then
            echo "base: $base" >> "$RUNNER_TEMP/units.txt"
            sed 's/^/destroy: /' "$RUNNER_TEMP/destroy-units.txt" >> "$RUNNER_TEMP/units.txt"
          fi
          echo "Selected units:"
          sed 's/^/  /' "$RUNNER_TEMP/units.txt"

      # A re-plan of the same head replaces that head's plan. The old one goes
      # first, so a failed re-plan leaves no artifact for apply to fall back on.
      - name: Delete any earlier plan for this head
        if: inputs.command == 'plan'
        uses: actions/github-script@v7
        env:
          ARTIFACT: ${{ steps.head.outputs.artifact }}
        with:
          script: |
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: process.env.ARTIFACT,
            });
            for (const a of data.artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id,
              });
            }

      # Apply runs only from the plan made for exactly this head. No artifact
      # means the head moved since the plan, the plan failed, or it expired.
      - name: Fetch saved plan
        id: saved
        if: inputs.command == 'apply'
        uses: actions/github-script@v7
        env:
          ARTIFACT: ${{ steps.head.outputs.artifact }}
        with:
          script: |
            const fs = require('fs');
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: process.env.ARTIFACT,
            });
            const artifact = data.artifacts.filter(a => !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (!artifact) {
              core.setOutput('found', 'false');
              return;
            }
            const zip = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/plan.zip`, Buffer.from(zip.data));
            core.setOutput('found', 'true');

      - name: Unpack saved plan
        id: unpack
        if: inputs.command == 'apply' && steps.saved.outputs.found == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SCRIPTS_DIR: ${{ inputs.scripts_dir }}
        run: |
          set -euo pipefail
          unzip -q -o "$RUNNER_TEMP/plan.zip" -d "$RUNNER_TEMP/plan"
          "$SCRIPTS_DIR/plan-archive.sh" unpack "$RUNNER_TEMP/plan/plan.enc" "$PLAN_DIR"
          if cmp -s "$PLAN_DIR/units.txt" "$RUNNER_TEMP/units.txt"; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The units selected now differ from the saved plan's"
            diff "$PLAN_DIR/units.txt" "$RUNNER_TEMP/units.txt" || true
            echo "matches=false" >> "$GITHUB_OUTPUT"
          fi

      - name: terragrunt ${{ inputs.command }}
        id: run
        if: inputs.command == 'plan' || steps.unpack.outputs.matches == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TG_TF_PATH: terraform
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          FILTER_ARGS=()
          while IFS= read -r arg; do FILTER_ARGS+=("$arg"); done < "$RUNNER_TEMP/filter-args"
          # Apply fails at once on a held lock rather than waiting for it and
          # then applying a stale plan (LIB-0022 §4).
          TF_ARGS=("$COMMAND")
          [ "$COMMAND" = apply ] && TF_ARGS+=(-lock-timeout=0s)
          [ "$COMMAND" = plan ] && rm -rf "$PLAN_DIR"
          # Each unit's plan as JSON too, for the comment's counts (LIB-0026).
          JSON_ARGS=()
          [ "$COMMAND" = plan ] && JSON_ARGS=(--json-out-dir "$JSON_DIR")

          set +e
          terragrunt --no-color run --all "${FILTER_ARGS[@]}" --filter-allow-destroy --non-interactive --out-dir "$PLAN_DIR" ${JSON_ARGS[@]+"${JSON_ARGS[@]}"} -- "${TF_ARGS[@]}" > output.txt 2>&1
          code=$?
          set -e

          # Workload leaves (LIB-0023), in an invocation of their own: see
          # "Select units". A plan takes them one at a time, in DAG order, and
          # defers any whose workload dependency is deferred or changing, since
          # a stub carries no mock_outputs and a changing dependency -- a new
          # one, or a rotating deployer key -- would leave its dependents'
          # saved plans stale (LIB-0024 §3). A deferred unit has no saved plan,
          # so apply applies exactly the units that have one.
          WORKLOAD_ARGS=()
          while IFS= read -r arg; do [ -n "$arg" ] && WORKLOAD_ARGS+=("$arg"); done < "$RUNNER_TEMP/workload-args"
          : > "$RUNNER_TEMP/deferred-units.txt"
          if [ ${#WORKLOAD_ARGS[@]} -gt 0 ] && [ "$code" -eq 0 ]; then
            terragrunt --no-color find "${WORKLOAD_ARGS[@]}" --dag --dependencies --format json \
              | jq -r '.[] | [(.path | sub("^\\./"; "")), ((.dependencies // []) | map(sub("^\\./"; "")) | join(" "))] | @tsv' \
              > "$RUNNER_TEMP/workload-dag.tsv"
            if [ "$COMMAND" = plan ]; then
              settled_not=" "
              while IFS=$'\t' read -r unit deps; do
                blocked=""
                for dep in $deps; do
                  case "$settled_not" in *" $dep "*) blocked="${blocked:+$blocked, }$dep" ;; esac
                done
                if [ -n "$blocked" ]; then
                  echo "$unit" >> "$RUNNER_TEMP/deferred-units.txt"
                  settled_not="$settled_not$unit "
                  echo "=== $unit: deferred until $blocked is applied ===" >> output.txt
                  continue
                fi
                set +e
                terragrunt --no-color run --all --filter "./$unit" --non-interactive --out-dir "$PLAN_DIR" --json-out-dir "$JSON_DIR" -- plan -detailed-exitcode >> output.txt 2>&1
                rc=$?
                set -e
                case "$rc" in
                  0) ;;
                  2) settled_not="$settled_not$unit " ;;
                  *) code=$rc; break ;;
                esac
              done < "$RUNNER_TEMP/workload-dag.tsv"
            else
              APPLY_ARGS=()
              while IFS=$'\t' read -r unit _; do
                if [ -f "$PLAN_DIR/$unit/tfplan.tfplan" ]; then
                  APPLY_ARGS+=(--filter "./$unit")
                else
                  echo "$unit" >> "$RUNNER_TEMP/deferred-units.txt"
                fi
              done < "$RUNNER_TEMP/workload-dag.tsv"
              if [ ${#APPLY_ARGS[@]} -gt 0 ]; then
                set +e
                terragrunt --no-color run --all "${APPLY_ARGS[@]}" --non-interactive --out-dir "$PLAN_DIR" -- "${TF_ARGS[@]}" >> output.txt 2>&1
                code=$?
                set -e
              fi
            fi
          fi
          if [ -s "$RUNNER_TEMP/deferred-units.txt" ]; then
            echo "deferred=true" >> "$GITHUB_OUTPUT"
            {
              echo "=== Deferred until their dependencies are applied (LIB-0024): ==="
              sed 's/^/  /' "$RUNNER_TEMP/deferred-units.txt"
            } >> output.txt
          fi

          # Workload instances values.yaml no longer has (LIB-0023), planned
          # with -destroy from the base's stubs. Their plans land in the same
          # $PLAN_DIR, keyed by the same relative paths. Terragrunt orders a
          # saved plan's apply as if it created, so the destroys are applied one
          # at a time, dependents first: the reverse of `find --dag`.
          if [ -s "$RUNNER_TEMP/destroy-units.txt" ] && [ "$code" -eq 0 ]; then
            DESTROY_ARGS=()
            while IFS= read -r unit; do DESTROY_ARGS+=(--filter "./$unit"); done < "$RUNNER_TEMP/destroy-units.txt"
            echo "=== Removed from values.yaml: planned as destroys from $(git merge-base main HEAD | cut -c1-7) ===" >> output.txt
            set +e
            if [ "$COMMAND" = plan ]; then
              (cd "$RUNNER_TEMP/base" && terragrunt --no-color run --all "${DESTROY_ARGS[@]}" --non-interactive --out-dir "$PLAN_DIR" --json-out-dir "$JSON_DIR" -- plan -destroy) >> output.txt 2>&1
              code=$?
            else
              order=$(cd "$RUNNER_TEMP/base" && terragrunt --no-color find "${DESTROY_ARGS[@]}" --dag --json | jq -r '.[].path' | sed 's|^\./||' | awk '{ u[NR] = $0 } END { for (i = NR; i > 0; i--) print u[i] }')
              for unit in $order; do
                (cd "$RUNNER_TEMP/base" && terragrunt --no-color run --all --filter "./$unit" --non-interactive --out-dir "$PLAN_DIR" -- apply -lock-timeout=0s) >> output.txt 2>&1
                code=$?
                [ "$code" -eq 0 ] || break
              done
            fi
            set -e
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if grep -qE 'Saved plan is stale|Error acquiring the state lock' output.txt; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack saved plan
        if: inputs.command == 'plan' && steps.run.outcome == 'success' && steps.run.outputs.exit_code == '0'
        env:
          SCRIPTS_DIR: ${{ inputs.scripts_dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/upload"
          "$SCRIPTS_DIR/plan-archive.sh" pack "$PLAN_DIR" "$RUNNER_TEMP/units.txt" "$RUNNER_TEMP/upload/plan.enc"

      - name: Upload saved plan
        if: inputs.command == 'plan' && steps.run.outcome == 'success' && steps.run.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.head.outputs.artifact }}
          path: ${{ runner.temp }}/upload/plan.enc
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      # A push's plan gets `pending` from terragrunt-detect.yml; a re-plan by
      # comment has no detect job, so it resets the gate itself.
      - name: Reset merge gate after a re-plan
        if: inputs.command == 'plan' && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: 'terragrunt/apply',
              description: 'Awaiting successful terragrunt apply',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Comment ${{ inputs.command }} output on PR
        id: comment
        if: always()
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          SAVED_FOUND: ${{ steps.saved.outputs.found }}
          UNITS_MATCH: ${{ steps.unpack.outputs.matches }}
          STALE: ${{ steps.run.outputs.stale }}
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
          DEFERRED: ${{ steps.run.outputs.deferred }}
          SCRIPTS_DIR: ${{ inputs.scripts_dir }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const command = '${{ inputs.command }}';
            const marker = `<!-- terragrunt-${command} -->`;
            const exitCode = process.env.EXIT_CODE;
            const success = exitCode === '0';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = command === 'apply' ? 'apply' : 'plan';
            const sha = (process.env.HEAD_SHA || '').slice(0, 7);
            const replanHint = 'Comment `terragrunt plan` on this PR to plan it again, rebasing first if `main` has changed the same leaves.';
            const replan = command === 'plan' && context.eventName === 'issue_comment' && (context.payload.comment?.body || '').trim() === 'terragrunt apply';

            let output;
            try {
              output = fs.readFileSync('output.txt', 'utf8');
            } catch {
              output = null;
            }

            let body;
            let details = [];
            if (command === 'apply' && process.env.SAVED_FOUND === 'false') {
              body = [
                marker,
                `### ❌ Terragrunt apply`,
                `_No saved plan for \`${sha}\`: the PR's head moved since its plan, the plan failed, or it expired. Nothing was applied._`,
                '',
                replanHint,
              ].join('\n');
            } else if (command === 'apply' && process.env.UNITS_MATCH === 'false') {
              body = [
                marker,
                `### ❌ Terragrunt apply`,
                `_The units this PR selects have changed since \`${sha}\` was planned — see the [full log](${runUrl}). Nothing was applied._`,
                '',
                replanHint,
              ].join('\n');
            } else if (output === null) {
              body = [
                marker,
                `### ❌ Terragrunt ${label}`,
                `_Job failed before \`terragrunt ${label}\` ran — see the [full log](${runUrl})._`,
              ].join('\n');
            } else {
              let footer = '';
              const deferred = process.env.DEFERRED === 'true';
              if (command !== 'apply' && success) {
                footer = `Planned \`${sha}\`. Comment \`terragrunt apply\` on this PR to apply exactly this plan.`;
                if (deferred) footer += ' Some workload leaves are deferred until what they depend on is applied: after the apply, the next stage plans by itself.';
              } else if (command === 'apply' && success && deferred) {
                footer = 'Applied this stage. Some workload leaves are still deferred, and the next stage plans by itself (LIB-0027); if no plan follows, comment `terragrunt plan`.';
              } else if (command === 'apply' && process.env.STALE === 'true') {
                footer = `Another apply has changed or is holding this state since \`${sha}\` was planned. ${replanHint}`;
              }
              // A summary with a row per leaf, then detail comments with a
              // section per leaf, never truncated (LIB-0026).
              const read = (f) => { try { return fs.readFileSync(f, 'utf8'); } catch { return ''; } };
              const lines = (f) => read(f).split('\n').filter(Boolean);
              const jsonPlans = {};
              const walk = (dir) => {
                let entries = [];
                try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { return; }
                for (const e of entries) {
                  const p = path.join(dir, e.name);
                  if (e.isDirectory()) walk(p);
                  else if (e.name.endsWith('.json')) {
                    try { jsonPlans[path.relative(process.env.JSON_DIR, path.dirname(p))] = JSON.parse(read(p)); } catch {}
                  }
                }
              };
              walk(process.env.JSON_DIR);
              const { render } = require(path.join(process.env.GITHUB_WORKSPACE, process.env.SCRIPTS_DIR, 'render-run-comments.js'));
              const rendered = render({
                command: label,
                success,
                sha,
                runUrl,
                marker,
                output,
                jsonPlans,
                deferred: lines(`${process.env.RUNNER_TEMP}/deferred-units.txt`),
                destroys: lines(`${process.env.RUNNER_TEMP}/destroy-units.txt`),
                masked: lines(`${process.env.RUNNER_TEMP}/masked.txt`),
                roots: [process.env.GITHUB_WORKSPACE, `${process.env.RUNNER_TEMP}/base`],
                footer,
                // A plan started by a `terragrunt apply` comment is a caller's
                // replan job, after a staged apply (LIB-0027 §1). If it finds
                // nothing left to apply, it merges (LIB-0027's amendment).
                note: replan ? '_Planned automatically after the previous stage\'s apply._' : '',
                settledFooter: replan ? 'Nothing left to apply: merging.' : '',
              });
              body = rendered.summary;
              details = rendered.details;
              core.setOutput('settled', replan && rendered.settled ? 'true' : 'false');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const minimize = `mutation($id: ID!) { minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) { clientMutationId } }`;
            for (const c of comments.filter(c => c.body.includes(marker))) {
              await github.graphql(minimize, { id: c.node_id });
            }
            // The summary first, then each detail comment about a second
            // apart, then the summary again with its rows linked.
            const post = (text) => github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: text,
            });
            const { data: summary } = await post(details.length ? body.replace(/\{\{detail:[^}]*\}\}/g, '…') : body);
            const urls = [];
            for (const d of details) {
              await new Promise((r) => setTimeout(r, 1000));
              const { data } = await post(d);
              urls.push(data.html_url);
            }
            if (details.length) {
              const { linkSummary } = require(path.join(process.env.GITHUB_WORKSPACE, process.env.SCRIPTS_DIR, 'render-run-comments.js'));
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: summary.id,
                body: linkSummary(body, urls),
              });
            }

            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: success ? '+1' : '-1',
              });
            }

      - name: Set merge-gate status
        if: always() && inputs.command == 'apply'
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          DEFERRED: ${{ steps.run.outputs.deferred }}
        with:
          script: |
            const success = process.env.EXIT_CODE === '0';
            // An apply that left workload leaves deferred (LIB-0024 §3) is a
            // stage, not the end: the gate stays pending and nothing merges.
            const staged = success && process.env.DEFERRED === 'true';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA || pr.head.sha,
              state: staged ? 'pending' : success ? 'success' : 'failure',
              context: 'terragrunt/apply',
              description: staged
                ? 'Deferred units remain; the next stage plans next'
                : success ? 'terragrunt apply succeeded' : 'terragrunt apply failed',
              target_url: runUrl,
            });

      # An automatic re-plan that finds nothing left to apply, defer or fix
      # closes the PR without another apply (LIB-0027's amendment): an apply
      # of its plan would do nothing. Only the replan job's plan qualifies,
      # since its run was started by a person's `terragrunt apply`.
      - name: Close a settled re-plan
        if: inputs.command == 'plan' && steps.comment.outputs.settled == 'true'
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'success',
              context: 'terragrunt/apply',
              description: 'Re-plan found nothing left to apply (LIB-0027)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      # The merge after a final apply, with the caller's bot token when it has
      # one (LIB-0027 §2): GITHUB_TOKEN can't merge under the callers'
      # contents: read, and a merge it made would start none of the workflows
      # that follow a merge. Its own step, since github-token is per step.
      #
      # Every check of exit_code first requires that the run step ran: a
      # skipped step's outputs are null, and an expression's loose equality
      # makes null == '0' true. Without it, an apply refused for a missing or
      # mismatched saved plan merged its PR with nothing applied.
      - name: Auto-merge
        if: >
          (inputs.command == 'apply' && steps.run.outcome == 'success' && steps.run.outputs.exit_code == '0' && steps.run.outputs.deferred != 'true') ||
          (inputs.command == 'plan' && steps.comment.outputs.settled == 'true')
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          TOKEN_NAME: ${{ secrets.BOT_GITHUB_TOKEN != '' && 'BOT_GITHUB_TOKEN' || 'GITHUB_TOKEN' }}
        with:
          github-token: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                sha: process.env.HEAD_SHA,
                merge_method: 'squash',
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${pr.head.ref}`,
              }).catch(() => {});
            } catch (err) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ Terragrunt apply succeeded, but auto-merge with ${process.env.TOKEN_NAME} failed: ${err.message}. The token needs Contents and Pull requests write on this repository (LIB-0027 §2). Please merge manually.`,
              });
            }

      - name: Forget masked values
        if: always()
        run: rm -f "$RUNNER_TEMP/masked.txt"

      - name: Fail if ${{ inputs.command }} failed
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: exit "${EXIT_CODE:-1}"
