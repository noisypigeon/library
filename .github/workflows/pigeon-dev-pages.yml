# Deploys pigeon.dev/src to GitHub Pages. Same-repo call into
# zola-site-pages.yml (not noisypigeon/pigeon.dev/...@main) -- deploy-pages
# always targets the calling repo's own Pages site, so this caller has to
# live here, where that Pages site actually is (ADR-0156).
name: Deploy pigeon.dev

on:
  push:
    branches: ["main"]
    paths:
      - "pigeon.dev/**"
      - "templates/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pigeon-dev-pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/zola-site-pages.yml
    with:
      src_dir: pigeon.dev/src
      build_cmd: "zola build"
      extra_step: "pigeon.dev/generate-module-redirects.sh"
