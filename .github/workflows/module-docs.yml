name: module-docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
  workflow_dispatch: {}

permissions:
  contents: write

# Own group -- see template-release.yml for why a shared one drops runs.
concurrency:
  group: main-writer-docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Generate module docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: terraform/scaleway/project,terraform/scaleway/object-bucket,terraform/scaleway/iam-policy,terraform/scaleway/compute-instance,terraform/scaleway/compute-instance-config,terraform/scaleway/block-volume,terraform/scaleway/cockpit-observability,terraform/scaleway/pigeon-cluster,terraform/backblaze/bucket,terraform/backblaze/api-key,terraform/cloudflare/dns-record
          output-file: README.md
          output-method: inject
          output-format: markdown table
          args: --show inputs --show outputs
          git-push: "true"
          git-push-user-name: "istx25"
          git-push-user-email: "6799989+istx25@users.noreply.github.com"
          git-commit-message: "docs: regenerate module input/output tables"
