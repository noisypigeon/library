name: template-release

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "terraform/**"
      - "zola-site/**"
      - ".github/**"

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Determine bump level from PR labels
        id: bump
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          if echo "$LABELS_JSON" | jq -e '.[] | select(.name=="release:major")' >/dev/null; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS_JSON" | jq -e '.[] | select(.name=="release:minor")' >/dev/null; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS_JSON" | jq -e '.[] | select(.name=="release:patch")' >/dev/null; then
            echo "level=patch" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release:* label found on PR #${{ github.event.pull_request.number }}; defaulting to patch."
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine changed module directories
        id: modules
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "${MERGE_SHA}~1" "$MERGE_SHA")

          MODULE_DIRS=$(find terraform -mindepth 3 -maxdepth 3 -name versions.tf -printf '%h\n' | sort)

          CHANGED_MODULES=""
          for dir in $MODULE_DIRS; do
            if echo "$CHANGED_FILES" | grep -qE "^${dir}/.*\.tf$"; then
              CHANGED_MODULES="$CHANGED_MODULES $dir"
            fi
          done

          echo "changed=${CHANGED_MODULES# }" >> "$GITHUB_OUTPUT"

      - name: Determine zola-site change
        id: zola_site
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "${MERGE_SHA}~1" "$MERGE_SHA")
          if echo "$CHANGED_FILES" | grep -qE '^zola-site/(templates/|static/|theme\.toml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The spokes call the reusable workflows and fetch root-changelog.sh, so
      # all of .github/ travels under one version -- LIB-0001 invariant 2 says a
      # spoke pins a version rather than tracking a branch, and DEV-0155 deferred
      # exactly this track on the grounds that live @main was cheaper. It is no
      # longer cheaper now that three spokes consume it.
      #
      # CHANGELOG.md is excluded: the automation writes it, and a release must
      # not be able to trigger itself.
      - name: Determine reusable-CI change
        id: workflows
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "${MERGE_SHA}~1" "$MERGE_SHA")
          if echo "$CHANGED_FILES" | grep -qE '^\.github/(workflows/[^/]+\.yml|scripts/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.modules.outputs.changed != '' || steps.zola_site.outputs.changed == 'true' || steps.workflows.outputs.changed == 'true'
        run: |
          git config user.name "istx25"
          git config user.email "6799989+istx25@users.noreply.github.com"

      - name: Update changelogs and compute versions
        id: versions
        if: steps.modules.outputs.changed != ''
        env:
          BUMP: ${{ steps.bump.outputs.level }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CHANGED_MODULES: ${{ steps.modules.outputs.changed }}
        run: |
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          TAGS=""

          for dir in $CHANGED_MODULES; do
            LATEST=$(git tag -l "${dir}/v*" | sed "s#${dir}/v##" | sort -V | tail -n1)

            if [ -z "$LATEST" ]; then
              NEXT="0.1.0"
            else
              MA=$(echo "$LATEST" | cut -d. -f1)
              MI=$(echo "$LATEST" | cut -d. -f2)
              PA=$(echo "$LATEST" | cut -d. -f3)
              case "$BUMP" in
                major) NEXT="$((MA+1)).0.0" ;;
                minor) NEXT="${MA}.$((MI+1)).0" ;;
                patch) NEXT="${MA}.${MI}.$((PA+1))" ;;
              esac
            fi

            CHANGELOG="${dir}/CHANGELOG.md"
            if [ ! -f "$CHANGELOG" ]; then
              cat > "$CHANGELOG" <<'HEADER'
          # Changelog

          All notable changes to this module are documented in this file.

          The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
          HEADER
            fi

            ENTRY=$(mktemp)
            {
              echo ""
              echo "## [${NEXT}] - ${TODAY}"
              echo ""
              echo "### ${PR_TITLE}"
              echo ""
              echo "${PR_BODY}"
              echo ""
              echo "[#${PR_NUMBER}](${PR_URL})"
            } > "$ENTRY"

            head -n 5 "$CHANGELOG" > "${CHANGELOG}.new"
            cat "$ENTRY" >> "${CHANGELOG}.new"
            tail -n +6 "$CHANGELOG" >> "${CHANGELOG}.new"
            mv "${CHANGELOG}.new" "$CHANGELOG"

            git add "$CHANGELOG"
            TAGS="$TAGS ${dir}/v${NEXT}"

            # Also add a one-liner to the repo-wide root CHANGELOG.md (DEV-0160).
            # Passing --date reuses the $TODAY above, so the rollup line and this
            # module's own entry can never straddle a midnight boundary.
            .github/scripts/root-changelog.sh \
              --tag "${dir#terraform/}" \
              --title "$PR_TITLE" \
              --number "$PR_NUMBER" \
              --url "$PR_URL" \
              --date "$TODAY"
            git add CHANGELOG.md
          done

          echo "tags=${TAGS# }" >> "$GITHUB_OUTPUT"

      - name: Update zola-site changelog and compute version
        id: zola_site_version
        if: steps.zola_site.outputs.changed == 'true'
        env:
          BUMP: ${{ steps.bump.outputs.level }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          DIR="zola-site"

          LATEST=$(git tag -l "${DIR}/v*" | sed "s#${DIR}/v##" | sort -V | tail -n1)

          if [ -z "$LATEST" ]; then
            NEXT="1.0.0"
          else
            MA=$(echo "$LATEST" | cut -d. -f1)
            MI=$(echo "$LATEST" | cut -d. -f2)
            PA=$(echo "$LATEST" | cut -d. -f3)
            case "$BUMP" in
              major) NEXT="$((MA+1)).0.0" ;;
              minor) NEXT="${MA}.$((MI+1)).0" ;;
              patch) NEXT="${MA}.${MI}.$((PA+1))" ;;
            esac
          fi

          CHANGELOG="${DIR}/CHANGELOG.md"
          if [ ! -f "$CHANGELOG" ]; then
            cat > "$CHANGELOG" <<'HEADER'
          # Changelog

          All notable changes to this theme are documented in this file.

          The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
          HEADER
          fi

          ENTRY=$(mktemp)
          {
            echo ""
            echo "## [${NEXT}] - ${TODAY}"
            echo ""
            echo "### ${PR_TITLE}"
            echo ""
            echo "${PR_BODY}"
            echo ""
            echo "[#${PR_NUMBER}](${PR_URL})"
          } > "$ENTRY"

          head -n 5 "$CHANGELOG" > "${CHANGELOG}.new"
          cat "$ENTRY" >> "${CHANGELOG}.new"
          tail -n +6 "$CHANGELOG" >> "${CHANGELOG}.new"
          mv "${CHANGELOG}.new" "$CHANGELOG"
          git add "$CHANGELOG"

          # One-liner into the root CHANGELOG.md, same contract as above (DEV-0160).
          .github/scripts/root-changelog.sh \
            --tag "zola-site" \
            --title "$PR_TITLE" \
            --number "$PR_NUMBER" \
            --url "$PR_URL" \
            --date "$TODAY"
          git add CHANGELOG.md

          echo "tag=${DIR}/v${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Update reusable-CI changelog and compute version
        id: workflows_version
        if: steps.workflows.outputs.changed == 'true'
        env:
          BUMP: ${{ steps.bump.outputs.level }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)

          LATEST=$(git tag -l "workflows/v*" | sed "s#workflows/v##" | sort -V | tail -n1)

          if [ -z "$LATEST" ]; then
            NEXT="1.0.0"
          else
            MA=$(echo "$LATEST" | cut -d. -f1)
            MI=$(echo "$LATEST" | cut -d. -f2)
            PA=$(echo "$LATEST" | cut -d. -f3)
            case "$BUMP" in
              major) NEXT="$((MA+1)).0.0" ;;
              minor) NEXT="${MA}.$((MI+1)).0" ;;
              patch) NEXT="${MA}.${MI}.$((PA+1))" ;;
            esac
          fi

          # Lives beside the workflows it versions. GitHub only reads *.yml from
          # this directory, so a CHANGELOG.md here is inert to Actions.
          CHANGELOG=".github/workflows/CHANGELOG.md"
          if [ ! -f "$CHANGELOG" ]; then
            cat > "$CHANGELOG" <<'HEADER'
          # Changelog

          All notable changes to the reusable CI are documented in this file.

          The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
          HEADER
          fi

          ENTRY=$(mktemp)
          {
            echo ""
            echo "## [${NEXT}] - ${TODAY}"
            echo ""
            echo "### ${PR_TITLE}"
            echo ""
            echo "${PR_BODY}"
            echo ""
            echo "[#${PR_NUMBER}](${PR_URL})"
          } > "$ENTRY"

          head -n 5 "$CHANGELOG" > "${CHANGELOG}.new"
          cat "$ENTRY" >> "${CHANGELOG}.new"
          tail -n +6 "$CHANGELOG" >> "${CHANGELOG}.new"
          mv "${CHANGELOG}.new" "$CHANGELOG"
          git add "$CHANGELOG"

          .github/scripts/root-changelog.sh \
            --tag "workflows" \
            --title "$PR_TITLE" \
            --number "$PR_NUMBER" \
            --url "$PR_URL" \
            --date "$TODAY"
          git add CHANGELOG.md

          echo "tag=workflows/v${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Commit changelog updates
        if: steps.modules.outputs.changed != '' || steps.zola_site.outputs.changed == 'true' || steps.workflows.outputs.changed == 'true'
        run: |
          git commit -m "chore: update changelog(s) for PR #${{ github.event.pull_request.number }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Tag and release each changed module/theme/CI version
        if: steps.modules.outputs.changed != '' || steps.zola_site.outputs.changed == 'true' || steps.workflows.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RELEASE_TAGS: ${{ steps.versions.outputs.tags }} ${{ steps.zola_site_version.outputs.tag }} ${{ steps.workflows_version.outputs.tag }}
        run: |
          NOTES=$(mktemp)
          printf '%s\n\nPR: %s\n' "$PR_BODY" "$PR_URL" > "$NOTES"

          for tag in $RELEASE_TAGS; do
            git tag "$tag"
            git push origin "$tag"
            gh release create "$tag" --title "$tag" --notes-file "$NOTES"
          done

      # The hub hosts no site, so every deploy dispatch is cross-repo
      # (LIB-0002). pigeon.dev publishes the module redirect pages, overview
      # pages, theme-version pages and release posts, so it rebuilds on any
      # release; noisypigeon.com only renders with the theme, so it rebuilds
      # on a theme release only.
      #
      # Runs *after* the tags are pushed above: the spoke's generator reads
      # this repo's tag list, so dispatching first would race the tag into
      # existence.
      #
      # Both need BOT_GITHUB_TOKEN to carry actions: write on the target. If
      # it doesn't, these steps fail loudly -- which is the point. A missed
      # dispatch leaves a version tagged and released here whose short URL
      # 404s on the site.
      - name: Trigger pigeon.dev Pages deploy
        if: steps.versions.outputs.tags != '' || steps.zola_site.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: gh workflow run pigeon-dev-pages.yml -R noisypigeon/pigeon.dev --ref main

      # Replaces a dispatch at zola-sites-deploy.yml in noisypigeon/noisypigeon,
      # which DEV-0159 removed from that repo -- so this step had been failing
      # on every theme release until LIB-0002 repointed it here.
      - name: Trigger noisypigeon.com Pages deploy
        if: steps.zola_site.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: gh workflow run noisypigeon-com-pages.yml -R noisypigeon/noisypigeon.com --ref main
