name: template-release

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "templates/terraform/**"
      - "templates/zola-site/**"

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Determine bump level from PR labels
        id: bump
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          if echo "$LABELS_JSON" | jq -e '.[] | select(.name=="release:major")' >/dev/null; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS_JSON" | jq -e '.[] | select(.name=="release:minor")' >/dev/null; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS_JSON" | jq -e '.[] | select(.name=="release:patch")' >/dev/null; then
            echo "level=patch" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release:* label found on PR #${{ github.event.pull_request.number }}; defaulting to patch."
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine changed module directories
        id: modules
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "${MERGE_SHA}~1" "$MERGE_SHA")

          MODULE_DIRS=$(find templates/terraform -mindepth 3 -maxdepth 3 -name versions.tf -printf '%h\n' | sort)

          CHANGED_MODULES=""
          for dir in $MODULE_DIRS; do
            if echo "$CHANGED_FILES" | grep -qE "^${dir}/.*\.tf$"; then
              CHANGED_MODULES="$CHANGED_MODULES $dir"
            fi
          done

          echo "changed=${CHANGED_MODULES# }" >> "$GITHUB_OUTPUT"

      - name: Determine zola-site change
        id: zola_site
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "${MERGE_SHA}~1" "$MERGE_SHA")
          if echo "$CHANGED_FILES" | grep -qE '^templates/zola-site/(templates/|static/|theme\.toml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.modules.outputs.changed != '' || steps.zola_site.outputs.changed == 'true'
        run: |
          git config user.name "istx25"
          git config user.email "6799989+istx25@users.noreply.github.com"

      - name: Update changelogs and compute versions
        id: versions
        if: steps.modules.outputs.changed != ''
        env:
          BUMP: ${{ steps.bump.outputs.level }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CHANGED_MODULES: ${{ steps.modules.outputs.changed }}
        run: |
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          TAGS=""

          for dir in $CHANGED_MODULES; do
            PROVIDER=$(basename "$(dirname "$dir")")
            MODULE=$(basename "$dir")
            LATEST=$(git tag -l "${dir}/v*" | sed "s#${dir}/v##" | sort -V | tail -n1)

            if [ -z "$LATEST" ]; then
              NEXT="0.1.0"
            else
              MA=$(echo "$LATEST" | cut -d. -f1)
              MI=$(echo "$LATEST" | cut -d. -f2)
              PA=$(echo "$LATEST" | cut -d. -f3)
              case "$BUMP" in
                major) NEXT="$((MA+1)).0.0" ;;
                minor) NEXT="${MA}.$((MI+1)).0" ;;
                patch) NEXT="${MA}.${MI}.$((PA+1))" ;;
              esac
            fi

            CHANGELOG="${dir}/CHANGELOG.md"
            if [ ! -f "$CHANGELOG" ]; then
              cat > "$CHANGELOG" <<'HEADER'
          # Changelog

          All notable changes to this module are documented in this file.

          The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
          HEADER
            fi

            ENTRY=$(mktemp)
            {
              echo ""
              echo "## [${NEXT}] - ${TODAY}"
              echo ""
              echo "### ${PR_TITLE}"
              echo ""
              echo "${PR_BODY}"
              echo ""
              echo "[#${PR_NUMBER}](${PR_URL})"
            } > "$ENTRY"

            head -n 5 "$CHANGELOG" > "${CHANGELOG}.new"
            cat "$ENTRY" >> "${CHANGELOG}.new"
            tail -n +6 "$CHANGELOG" >> "${CHANGELOG}.new"
            mv "${CHANGELOG}.new" "$CHANGELOG"

            git add "$CHANGELOG"
            TAGS="$TAGS ${dir}/v${NEXT}"

            # Also append a one-liner to the repo-wide root CHANGELOG.md (ADR-0050).
            ROOT_CHANGELOG="CHANGELOG.md"
            ROOT_ENTRY="- [${dir#templates/terraform/}] ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL}))"
            if grep -q "^## ${TODAY}\$" "$ROOT_CHANGELOG"; then
              awk -v today="## ${TODAY}" -v entry="$ROOT_ENTRY" '
                { print }
                $0 == today { print ""; print entry }
              ' "$ROOT_CHANGELOG" > "${ROOT_CHANGELOG}.new"
            else
              awk -v today="## ${TODAY}" -v entry="$ROOT_ENTRY" '
                BEGIN { inserted = 0 }
                /^## / && !inserted { print today; print ""; print entry; print ""; inserted = 1 }
                { print }
                END { if (!inserted) { print ""; print today; print ""; print entry } }
              ' "$ROOT_CHANGELOG" > "${ROOT_CHANGELOG}.new"
            fi
            mv "${ROOT_CHANGELOG}.new" "$ROOT_CHANGELOG"
            git add "$ROOT_CHANGELOG"
          done

          echo "tags=${TAGS# }" >> "$GITHUB_OUTPUT"

      - name: Update zola-site changelog and compute version
        id: zola_site_version
        if: steps.zola_site.outputs.changed == 'true'
        env:
          BUMP: ${{ steps.bump.outputs.level }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          DIR="templates/zola-site"

          LATEST=$(git tag -l "${DIR}/v*" | sed "s#${DIR}/v##" | sort -V | tail -n1)

          if [ -z "$LATEST" ]; then
            NEXT="1.0.0"
          else
            MA=$(echo "$LATEST" | cut -d. -f1)
            MI=$(echo "$LATEST" | cut -d. -f2)
            PA=$(echo "$LATEST" | cut -d. -f3)
            case "$BUMP" in
              major) NEXT="$((MA+1)).0.0" ;;
              minor) NEXT="${MA}.$((MI+1)).0" ;;
              patch) NEXT="${MA}.${MI}.$((PA+1))" ;;
            esac
          fi

          CHANGELOG="${DIR}/CHANGELOG.md"
          if [ ! -f "$CHANGELOG" ]; then
            cat > "$CHANGELOG" <<'HEADER'
          # Changelog

          All notable changes to this theme are documented in this file.

          The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
          HEADER
          fi

          ENTRY=$(mktemp)
          {
            echo ""
            echo "## [${NEXT}] - ${TODAY}"
            echo ""
            echo "### ${PR_TITLE}"
            echo ""
            echo "${PR_BODY}"
            echo ""
            echo "[#${PR_NUMBER}](${PR_URL})"
          } > "$ENTRY"

          head -n 5 "$CHANGELOG" > "${CHANGELOG}.new"
          cat "$ENTRY" >> "${CHANGELOG}.new"
          tail -n +6 "$CHANGELOG" >> "${CHANGELOG}.new"
          mv "${CHANGELOG}.new" "$CHANGELOG"
          git add "$CHANGELOG"

          ROOT_CHANGELOG="CHANGELOG.md"
          ROOT_ENTRY="- [zola-site] ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL}))"
          if grep -q "^## ${TODAY}\$" "$ROOT_CHANGELOG"; then
            awk -v today="## ${TODAY}" -v entry="$ROOT_ENTRY" '
              { print }
              $0 == today { print ""; print entry }
            ' "$ROOT_CHANGELOG" > "${ROOT_CHANGELOG}.new"
          else
            awk -v today="## ${TODAY}" -v entry="$ROOT_ENTRY" '
              BEGIN { inserted = 0 }
              /^## / && !inserted { print today; print ""; print entry; print ""; inserted = 1 }
              { print }
              END { if (!inserted) { print ""; print today; print ""; print entry } }
            ' "$ROOT_CHANGELOG" > "${ROOT_CHANGELOG}.new"
          fi
          mv "${ROOT_CHANGELOG}.new" "$ROOT_CHANGELOG"
          git add "$ROOT_CHANGELOG"

          echo "tag=${DIR}/v${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Commit changelog updates
        if: steps.modules.outputs.changed != '' || steps.zola_site.outputs.changed == 'true'
        run: |
          git commit -m "chore: update changelog(s) for PR #${{ github.event.pull_request.number }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Tag and release each changed module/theme
        if: steps.modules.outputs.changed != '' || steps.zola_site.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RELEASE_TAGS: ${{ steps.versions.outputs.tags }} ${{ steps.zola_site_version.outputs.tag }}
        run: |
          NOTES=$(mktemp)
          printf '%s\n\nPR: %s\n' "$PR_BODY" "$PR_URL" > "$NOTES"

          for tag in $RELEASE_TAGS; do
            git tag "$tag"
            git push origin "$tag"
            gh release create "$tag" --title "$tag" --notes-file "$NOTES"
          done

      # pigeon.dev's own module pages / release posts live here since
      # ADR-0156, so a module release's redirect pages are an in-repo
      # dispatch now -- no cross-repo call needed for that case any more.
      # Runs *after* the tags are pushed above: the generator reads this
      # repo's own tag list, so dispatching first would race the tag into
      # existence.
      - name: Trigger pigeon.dev Pages deploy
        if: steps.versions.outputs.tags != '' || steps.zola_site.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: gh workflow run pigeon-dev-pages.yml -R ${{ github.repository }} --ref main

      # noisypigeon.com is a separate repo and still on the Scaleway-bucket
      # deploy path (ADR-0132/0155) -- a zola-site release is the only case
      # that still needs a cross-repo dispatch, since that's the one change
      # that affects a site this repo doesn't host.
      #
      # Needs BOT_GITHUB_TOKEN to carry actions: write on that repo. If it
      # doesn't, this step fails loudly -- which is the point. A missed
      # dispatch leaves the theme tagged and released here but
      # noisypigeon.com never rebuilds against it.
      - name: Trigger noisypigeon.com deploy in noisypigeon/noisypigeon
        if: steps.zola_site.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          gh workflow run zola-sites-deploy.yml \
            -R noisypigeon/noisypigeon --ref main -f site=noisypigeon.com
