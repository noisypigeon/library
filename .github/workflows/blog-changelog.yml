# Reusable: on a merged PR touching a blog's src/, prepends an entry to that
# blog's own CHANGELOG.md, optionally rolls up a one-liner into the caller's
# root CHANGELOG.md, appends to (or creates) a daily digest post under the
# site's content/changelog/, and dispatches that site's deploy.
#
# The root rollup earns its keep in a repo aggregating several workloads; a
# single-site repo wants one changelog, at its root. So `changelog_path` names
# the blog's changelog independently of `site_dir`, and an empty
# `root_changelog_tag` (the default) skips the rollup altogether. See COM-0000
# (filed as NPC-0000).
#
# Where the site lives is named one of two ways. `src_dir` is the Zola site
# root itself -- the same vocabulary zola-site-pages.yml uses -- and puts the
# daily digest under <src_dir>/content/changelog/. `site_dir` is the older
# shape, a directory holding a src/ beneath it, and puts the digest under
# <site_dir>/src/content/changelog/. A spoke whose site root is web/ cannot be
# described by site_dir at all, which is why src_dir exists.
#
# Site paths are inputs rather than hardcoded, since this now runs from
# another repo and has no business assuming the caller only ever has one
# blog. `github.*` throughout is the caller's context (actions/checkout in
# the caller already ran against the caller's own repo), which is what lets
# this keep reading and writing the caller's own tree.
name: Blog changelog

on:
  workflow_call:
    inputs:
      site_dir:
        description: "Path (in the caller's checkout) to a directory holding the blog's src/, e.g. noisypigeon.com. Resolves the daily digest under <site_dir>/src/content/changelog/. Set this or src_dir, not both."
        type: string
        required: false
        default: ""
      src_dir:
        description: "Path (in the caller's checkout) to the Zola site root itself, e.g. web. Resolves the daily digest under <src_dir>/content/changelog/. Set this or site_dir, not both; requires changelog_path."
        type: string
        required: false
        default: ""
      changelog_path:
        description: "Path (in the caller's checkout) to the blog's CHANGELOG.md. Defaults to <site_dir>/CHANGELOG.md when empty; required with src_dir, which has no such default."
        type: string
        required: false
        default: ""
      deploy_workflow:
        description: "Workflow filename (in the caller's repo) to dispatch after committing the changelog."
        type: string
        required: true
      site_key:
        description: "Optional `site` input to pass the dispatched workflow, for callers whose deploy workflow still multiplexes sites. Omit for a single-purpose deploy workflow (e.g. a Pages caller) that takes no such input."
        type: string
        required: false
        default: ""
      root_changelog_tag:
        description: "Bracket tag used in the caller's root CHANGELOG.md rollup line, e.g. 'blog'. Empty (the default) skips the root rollup entirely -- what a single-site repo wants."
        type: string
        required: false
        default: ""
      git_user_name:
        type: string
        required: false
        default: "istx25"
      git_user_email:
        type: string
        required: false
        default: "6799989+istx25@users.noreply.github.com"
    secrets:
      BOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: write
  actions: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Validate site inputs
        env:
          SITE_DIR: ${{ inputs.site_dir }}
          SRC_DIR: ${{ inputs.src_dir }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: |
          if [ -n "$SITE_DIR" ] && [ -n "$SRC_DIR" ]; then
            echo "::error::Set site_dir or src_dir, not both" >&2
            exit 1
          fi
          if [ -z "$SITE_DIR" ] && [ -z "$SRC_DIR" ]; then
            echo "::error::One of site_dir or src_dir is required" >&2
            exit 1
          fi
          if [ -n "$SRC_DIR" ] && [ -z "$CHANGELOG_PATH" ]; then
            echo "::error::src_dir requires changelog_path; there is no <src_dir>/CHANGELOG.md default" >&2
            exit 1
          fi

      # The newest main, not the merge commit. A changelog written on the merge
      # commit conflicts with any line another run pushed after it -- which is
      # how two releases merged back to back failed (#92). fetch-depth: 0 keeps
      # the merge commit reachable, so detection still diffs it by SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Configure git identity
        env:
          GIT_USER_NAME: ${{ inputs.git_user_name }}
          GIT_USER_EMAIL: ${{ inputs.git_user_email }}
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

      - name: Update blog changelog and daily digest
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SITE_DIR: ${{ inputs.site_dir }}
          SRC_DIR: ${{ inputs.src_dir }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          ROOT_CHANGELOG_TAG: ${{ inputs.root_changelog_tag }}
        run: |
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          OFFSET=$(TZ="America/Los_Angeles" date +%z | sed -E 's/([+-][0-9]{2})([0-9]{2})/\1:\2/')

          CHANGELOG="${CHANGELOG_PATH:-${SITE_DIR}/CHANGELOG.md}"
          if [ ! -f "$CHANGELOG" ]; then
            cat > "$CHANGELOG" <<'HEADER'
          # Changelog

          All notable changes to the blog are documented in this file.

          The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
          HEADER
          fi

          ENTRY=$(mktemp)
          {
            echo ""
            echo "## ${TODAY} — ${PR_TITLE}"
            echo ""
            echo "${PR_BODY}"
            echo ""
            echo "[#${PR_NUMBER}](${PR_URL})"
          } > "$ENTRY"

          head -n 5 "$CHANGELOG" > "${CHANGELOG}.new"
          cat "$ENTRY" >> "${CHANGELOG}.new"
          tail -n +6 "$CHANGELOG" >> "${CHANGELOG}.new"
          mv "${CHANGELOG}.new" "$CHANGELOG"
          git add "$CHANGELOG"

          # Optional: a one-line rollup into the caller's *repo-root* CHANGELOG.md,
          # for a repo aggregating several workloads. Empty tag => single-site repo,
          # whose only changelog is $CHANGELOG above. See COM-0000 (filed as NPC-0000).
          if [ -n "$ROOT_CHANGELOG_TAG" ]; then
            ROOT_CHANGELOG="CHANGELOG.md"
            if [ ! -f "$ROOT_CHANGELOG" ]; then
              printf '%s\n' '# Changelog' '' \
                'One line per PR across this repo, sectioned by date, newest first.' \
                > "$ROOT_CHANGELOG"
            fi
            ROOT_ENTRY="- [${ROOT_CHANGELOG_TAG}] ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL}))"
            if grep -q "^## ${TODAY}\$" "$ROOT_CHANGELOG"; then
              awk -v today="## ${TODAY}" -v entry="$ROOT_ENTRY" '
                { print }
                $0 == today { print ""; print entry }
              ' "$ROOT_CHANGELOG" > "${ROOT_CHANGELOG}.new"
            else
              awk -v today="## ${TODAY}" -v entry="$ROOT_ENTRY" '
                BEGIN { inserted = 0 }
                /^## / && !inserted { print today; print ""; print entry; print ""; inserted = 1 }
                { print }
                END { if (!inserted) { print ""; print today; print ""; print entry } }
              ' "$ROOT_CHANGELOG" > "${ROOT_CHANGELOG}.new"
            fi
            mv "${ROOT_CHANGELOG}.new" "$ROOT_CHANGELOG"
            git add "$ROOT_CHANGELOG"
          fi

          if [ -n "$SRC_DIR" ]; then
            CONTENT_DIR="${SRC_DIR}/content"
          else
            CONTENT_DIR="${SITE_DIR}/src/content"
          fi
          DIGEST="${CONTENT_DIR}/changelog/${TODAY}-changelog.md"
          if [ ! -f "$DIGEST" ]; then
            mkdir -p "$(dirname "$DIGEST")"
            cat > "$DIGEST" <<EOF2
          +++
          title = "Changelog: ${TODAY}"
          date = ${TODAY}T12:00:00${OFFSET}
          slug = "${TODAY}-changelog"
          description = "Changelog: ${TODAY}"
          +++

          EOF2
          fi
          if ! grep -q "#${PR_NUMBER}\]" "$DIGEST"; then
            echo "- ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL}))" >> "$DIGEST"
          fi

          STRIP_RE='^[a-z]+(\([^)]+\))?: '
          N=$(grep -c '^- ' "$DIGEST")
          FIRST_RAW=$(grep '^- ' "$DIGEST" | head -n1 | sed -E 's/^- (.*) \(\[#?[^]]*\]\(.*\)\)$/\1/')
          FIRST_CLEAN=$(printf '%s' "$FIRST_RAW" | sed -E "s/$STRIP_RE//")
          if [ "$N" -gt 1 ]; then
            DIGEST_TITLE="${FIRST_CLEAN} (+$((N-1)) more)"
          else
            DIGEST_TITLE="$FIRST_CLEAN"
          fi
          DIGEST_TITLE_ESCAPED=$(printf '%s' "$DIGEST_TITLE" | sed 's/\\/\\\\/g; s/"/\\"/g')
          sed -i "s|^title = .*|title = \"${DIGEST_TITLE_ESCAPED}\"|" "$DIGEST"
          sed -i "s|^description = .*|description = \"${DIGEST_TITLE_ESCAPED}\"|" "$DIGEST"

          git add "$DIGEST"

      - name: Commit changelog updates
        run: |
          git commit -m "chore: update changelog(s) for PR #${{ github.event.pull_request.number }}"
          # Retry rather than fail on a rejected push, as spoke-root-changelog.yml
          # does: the caller's other main writers can legitimately race for main.
          # This run wrote on the newest main, so a rebase conflict needs another
          # writer's line pushed in the seconds since the checkout. The changelog
          # and digest are written in an earlier step and can't simply be
          # rewritten here, so that conflict stays fatal.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase onto origin/main conflicted; refusing to guess"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); another writer won the race."
            sleep $((attempt * 5))
          done
          echo "::error::could not push to main after 5 attempts"
          exit 1

      - name: Trigger blog deploy
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy_workflow }}
          SITE_KEY: ${{ inputs.site_key }}
        run: |
          if [ -n "$SITE_KEY" ]; then
            gh workflow run "$DEPLOY_WORKFLOW" -R ${{ github.repository }} --ref main -f site="$SITE_KEY"
          else
            gh workflow run "$DEPLOY_WORKFLOW" -R ${{ github.repository }} --ref main
          fi
