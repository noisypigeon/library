name: root-changelog

# Every merged PR gets exactly one line in the root CHANGELOG.md (DEV-0160).
# template-release.yml already writes that line for PRs that release a module or
# the theme; this workflow covers everything else -- the site, the ADRs, CI, root
# docs -- which until DEV-0160 produced no changelog entry anywhere.
#
# Deliberately no `paths:` filter: the whole point is that no merged PR is
# exempt.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Own group -- see template-release.yml for why a shared one drops runs.
concurrency:
  group: main-writer-rollup
  cancel-in-progress: false

jobs:
  rollup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Derive the rollup tag, or stand down
        id: tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "${MERGE_SHA}~1" "$MERGE_SHA")

          # template-release.yml owns the root line for any PR that releases a
          # unit. All FIVE of its detection predicates are duplicated here on
          # purpose so that no PR ever gets two lines -- if one copy drifts from
          # the other, a releasing PR gets either two entries or none. DEV-0160
          # named that risk and LIB-0002 walked straight into it: adding the
          # workflows/ track here without the matching arm made both workflows
          # write a line for the same PR, and they collided on rebase.
          if echo "$CHANGED_FILES" | grep -qE '^terraform/[^/]+/[^/]+/.*\.tf$' \
            || echo "$CHANGED_FILES" | grep -qE '^zola-site/(templates/|static/|theme\.toml$)' \
            || echo "$CHANGED_FILES" | grep -qE '^\.github/(workflows/[^/]+\.yml|scripts/)' \
            || echo "$CHANGED_FILES" | grep -qE '^terragrunt/root-hcl/(root\.hcl|secrets-schema\.json)$' \
            || echo "$CHANGED_FILES" | grep -qE '^grafana-dashboards/[^/]+/[^/]+\.json$'; then
            echo "This PR releases a unit; template-release.yml writes its root entry."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One line per PR means one tag per PR: first match in this fixed
          # precedence wins, even for a PR spanning several areas.
          if echo "$CHANGED_FILES" | grep -q '^terraform/'; then
            TAG="terraform"
          elif echo "$CHANGED_FILES" | grep -q '^zola-site/'; then
            TAG="zola-site"
          elif echo "$CHANGED_FILES" | grep -q '^grafana-dashboards/'; then
            TAG="grafana-dashboards"
          elif echo "$CHANGED_FILES" | grep -q '^terragrunt/'; then
            TAG="terragrunt"
          elif echo "$CHANGED_FILES" | grep -q '^docs/adr/'; then
            TAG="adr"
          elif echo "$CHANGED_FILES" | grep -q '^\.github/'; then
            TAG="ci"
          else
            TAG="repo"
          fi

          echo "Rollup tag: ${TAG}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Write the root changelog line
        if: steps.tag.outputs.skip == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          git config user.name "istx25"
          git config user.email "6799989+istx25@users.noreply.github.com"

          .github/scripts/root-changelog.sh \
            --tag "$TAG" \
            --title "$PR_TITLE" \
            --number "$PR_NUMBER" \
            --url "$PR_URL"

          git add CHANGELOG.md
          git commit -m "chore: root changelog entry for PR #${PR_NUMBER}"
          # Retry rather than fail on a rejected push: these writers no longer
          # share a concurrency group, so two of them can legitimately race for
          # main. A rebase conflict is a different problem and stays fatal.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase onto origin/main conflicted; refusing to guess"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); another writer won the race."
            sleep $((attempt * 5))
          done
          echo "::error::could not push to main after 5 attempts"
          exit 1
