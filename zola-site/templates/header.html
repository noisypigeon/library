<header class="site-header h-card">
  <a class="site-header-avatar-link" title="{{ config.title }}" href="/">
    <img alt="{{ config.title }}" class="avatar u-photo" aria-hidden="true" src="{{ config.extra.avatar }}" width="72" height="72" />
  </a>
  <div>
    <div class="site-title m-0"><a class="p-name u-url" href="/">{{ config.title }}</a></div>
    <nav class="site-nav">
      <ul>
        {% for item in config.extra.nav %}
          <li><a class="site-nav-link" href="{{ item.link }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

<hr class="site-hr-below-site-header mt-L">
